<li class="cart-item"$grid_attrs>
  <a class="cart cart--$kind" href="$url">
    <span class="cart__ridges" aria-hidden="true"></span>
    <span class="cart__label">
      <span class="cart__art"><img src="$icon" alt="" width="512" height="512" loading="lazy" decoding="async"></span>
      <span class="cart__title">$name</span>
      <span class="cart__sub">$kind_label · $titleid</span>
    </span>
    <span class="cart__foot"><span>v$version</span><span class="cart__play">▶ Play</span></span>
  </a>
</li>
