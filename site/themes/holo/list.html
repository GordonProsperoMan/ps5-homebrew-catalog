<section class="wrap binder binder--list" aria-labelledby="list-title">
  <div class="binder__head">
    <h1 class="binder__title" id="list-title">All apps</h1>
    <span class="binder__count" data-count="{n} app{s}" aria-live="polite">$app_count apps</span>
  </div>
$toolbar
  <div class="list-head" aria-hidden="true">
    <div class="list-head__cols"><span></span><span>Name</span><span>Type</span><span>Title ID</span><span>Version</span><span>Updated</span><span class="col-dev">Developer</span></div>
  </div>
  <ul class="list" data-grid>
$rows
  </ul>
  <p class="empty" data-empty hidden>Nothing matches these filters. <a href="$submit_url">Missing an app? Add it.</a></p>
</section>
