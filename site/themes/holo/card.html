<li class="card-item"$grid_attrs>
  <a class="holo holo--$kind" href="$url" data-tilt="16">
    <span class="holo__frame">
      <span class="holo__top"><span class="holo__name">$name</span><span class="holo__type">$kind_label</span></span>
      <span class="holo__art"><img src="$icon" alt="" width="512" height="512" loading="lazy" decoding="async"></span>
      <span class="holo__strip"><span>$titleid · v$version</span><span>$format</span></span>
      <span class="holo__text">$description</span>
      <span class="holo__bottom"><span>$author</span><span>$updated</span></span>
    </span>
    <span class="holo__foil" aria-hidden="true"></span>
    <span class="holo__glare" aria-hidden="true"></span>
  </a>
</li>
