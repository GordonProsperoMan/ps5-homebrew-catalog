<li class="lrow lrow--$kind lrow--soon"$grid_attrs>
  <a class="lrow__link" href="$url">
    <span class="lrow__icon"><img src="$icon" alt="" width="512" height="512" loading="lazy" decoding="async"></span>
    <span class="lrow__main">
      <span class="lrow__name">$name</span>
      <span class="lrow__desc">$description</span>
      <span class="lrow__meta">$kind_label · Coming soon · $updated</span>
    </span>
    <span class="lrow__cell lrow__type"><span class="holo__type">$kind_label</span></span>
    <span class="lrow__cell lrow__mono">$titleid</span>
    <span class="lrow__cell"><span class="soon-pill">Soon</span></span>
    <span class="lrow__cell lrow__mono col-upd"><time datetime="$updated_iso">$updated</time></span>
    <span class="lrow__cell col-dev">$author</span>
  </a>
  <span class="lrow__dl lrow__dl--soon" title="Not released yet"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span class="sr-only">Not released yet</span></span>
</li>
