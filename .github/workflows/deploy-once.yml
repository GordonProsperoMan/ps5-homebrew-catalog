name: Deploy once (temporary)

# Temporary, for a GitHub Actions outage: the same deploy as ci.yml's last job,
# on a runner the maintainer started by hand. It runs only when a maintainer
# starts it, on main, so no pull request reaches that runner. Delete this file
# and remove the runner when the deploy is done.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy website to Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, catalog-temp]
    timeout-minutes: 20
    environment:
      name: cloudflare-pages
      url: https://homebrew.page/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The runner's own Python (with Pillow) is used; nothing is installed.
      - run: python3 -m unittest discover -s tests
      - run: python3 -m catalog build --out dist --icon-cache .icon-cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Sign the store API
        run: python3 -m catalog sign --out dist --require
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Upload to Cloudflare Pages
        run: |
          if npx --yes wrangler@4.143.0 pages deploy dist \
              --project-name "$PROJECT" --branch main \
              --commit-hash "$GITHUB_SHA" --commit-dirty=false \
              > "$RUNNER_TEMP/wrangler.log" 2>&1; then
            echo "Deployed to Cloudflare Pages."
          else
            echo "::error::Cloudflare Pages deployment failed. Redacted wrangler errors:"
            python3 -m catalog.redact "$RUNNER_TEMP/wrangler.log"
            exit 1
          fi
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
