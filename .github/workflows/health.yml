name: Catalog health

# Re-verifies every listed download: release still published, bytes still match
# the recorded sha256, package still valid, icon still reachable. Also reports
# apps whose projects have published a newer release.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Re-verify all records
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m catalog health
        env:
          GITHUB_TOKEN: ${{ github.token }}
